name: GTA6 Research Risk Tests

on:
  push:
    branches:
      - feature/v32-preentry-gate-pilot
    paths:
      - 'research_preentry_*.py'
      - 'research_quote_cohort_v33.py'
      - 'research_risk_gate_v29.py'
      - 'radar_jupiter_pacing_v30.py'
      - 'radar_quote_monitor.py'
      - 'radar_pretrade_safety.py'
      - 'radar_token_security.py'
      - 'tests/test_research_*.py'
      - 'tests/test_radar_jupiter_pacing_v30.py'
      - '.github/workflows/gta6-risk-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-tests:
    name: Research safety tests (offline only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Compile research and quote safety modules
        run: |
          python -m py_compile research_preentry_evidence_v31.py research_preentry_probe_v31.py research_preentry_fastdiag_v32.py research_quote_cohort_v33.py research_risk_gate_v29.py radar_jupiter_pacing_v30.py
      - name: Run comprehensive offline regression tests
        run: |
          python -m unittest tests.test_research_mint_integrity_v33 tests.test_research_quote_cohort_v33 tests.test_research_preentry_fastdiag_v32 tests.test_research_preentry_probe_v31 tests.test_research_preentry_evidence_v31 tests.test_radar_jupiter_pacing_v30 tests.test_research_risk_gate_v29 -v
      - name: Assert no trading credentials are available
        env:
          JUPITER_API_KEY: ''
          SOLANA_RPC_URL: ''
        run: |
          python - <<'PY'
          import os
          assert not os.getenv('JUPITER_API_KEY')
          assert not os.getenv('SOLANA_RPC_URL')
          print('offline-only test workflow')
          PY

  recent-data-diagnostic:
    name: Diagnose latest main collector snapshot (read-only)
    needs: risk-tests
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout research tools
        uses: actions/checkout@v4
        with:
          ref: feature/v32-preentry-gate-pilot
          fetch-depth: 1
      - name: Checkout current main collector snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-data
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research-only dependencies
        run: python -m pip install 'requests>=2.31,<3'
      - name: Restore ephemeral copy of main learning archive
        working-directory: main-data
        run: python learning_db_archive.py restore
      - name: Diagnose active market observations and portfolio capacity
        run: |
          python research_preentry_fastdiag_v32.py --db main-data/data/learning.db --state main-data/data/v591/portfolio.json
      - name: Probe up to 3 new B candidates (read-only Jupiter and Solana RPC)
        timeout-minutes: 3
        run: |
          python research_preentry_probe_v31.py --db main-data/data/learning.db --state main-data/data/v591/portfolio.json --limit 3 --shadow-capacity
      - name: Clean up disposable database
        if: always()
        run: rm -f main-data/data/learning.db
