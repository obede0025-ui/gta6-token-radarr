name: Liquidity destruction classification tests
on:
  push:
    branches: [feature/liquidity-loss-detection-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest tests.test_research_liquidity_spike_classifier -v
          python -m unittest tests.test_research_a_minute_quote_join -v
