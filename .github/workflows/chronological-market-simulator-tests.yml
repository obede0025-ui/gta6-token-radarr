name: Chronological market simulator tests
on:
  push:
    branches: [feature/chronological-market-simulator-20261120]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: |
          python -m unittest tests.test_research_chronological_market_simulator -v
          python -m unittest tests.test_research_weighted_momentum_shadow -v
