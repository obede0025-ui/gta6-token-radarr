
name: GTA6 Learning Collector

on:
  schedule:
    # Offset to avoid the busy start of each hour.
    # GitHub may delay or skip scheduled runs.
    - cron: '2-59/5 * * * *'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6-learning-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-collector.txt

      - name: Collect GTA6 data
        run: python collector.py

      - name: Save collected data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/learning.db data/latest_scan.json

          if git diff --cached --quiet; then
            echo 'No collector changes to commit'
          else
            git commit -m 'data: collect GTA6 observations [skip ci]'

            # Avoid force-pushing over newer repository changes.
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi

              git pull --rebase || {
                echo 'Rebase failed'
                exit 1
              }

              sleep 2
            done

            echo 'Push failed after three attempts' >&2
            exit 1
          fi

      - name: Upload collector results even if push fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-learning-run-${{ github.run_id }}
          path: |
            data/latest_scan.json
          if-no-files-found: ignore
          retention-days: 7
