
name: GTA6 Learning Collector

# V6.5 - Externe scheduler via cron-job.org.
# Geen interne GitHub-schedule meer.
# Handmatige en externe API-start blijven mogelijk.

on:
  workflow_dispatch:

permissions:
  contents: write

# Voorkom gelijktijdige wijzigingen aan de database.
concurrency:
  group: gta6-learning-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-collector.txt

      - name: Synchronize latest data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Verify Python engines
        run: |
          python -m py_compile \
            collector.py \
            v591_paper_engine.py \
            v592_paper_runner.py \
            v594_health.py

      # V6.1 - Token discovery en marktmetingen.
      - name: Collect GTA6 market data
        run: |
          python collector.py

      # V6.4 - Papertrading A/B/C met diagnostiek.
      - name: Run paper engine A B C
        run: |
          python v592_paper_runner.py

      # Scanhistoriek en systeemcontrole.
      - name: Record scan history
        run: |
          python v594_health.py

      # Bewaar bestaande learningdatabase,
      # paperportfolio en historische rapporten.
      - name: Save collector portfolio and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do

            git add \
              data/learning.db \
              data/latest_scan.json \
              data/v591/portfolio.json \
              data/v591/preview.json \
              data/v594/scan_history.json

            if git diff --cached --quiet; then
              echo "No changes"
              exit 0
            fi

            git commit -m \
              "data: GTA6 automatic collector [skip ci]"

            if git push origin HEAD:main; then
              echo "Collector and paper results saved"
              exit 0
            fi

            echo "Remote changed - rescan safely"

            git fetch origin main
            git reset --hard origin/main

            # Nieuwe marktmetingen uitvoeren vanaf
            # de meest recente opgeslagen state.
            python collector.py
            python v592_paper_runner.py
            python v594_health.py

            sleep 2
          done

          echo "Could not publish data" >&2
          exit 1

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-scans-${{ github.run_id }}
          path: |
            data/latest_scan.json
            data/v591/preview.json
            data/v594/scan_history.json
          if-no-files-found: ignore
          retention-days: 14
