name: GTA6 Learning Collector

# Existing external cron-job.org schedule unchanged.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6-learning-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-collector.txt

      - name: Synchronize latest data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Verify Python engines
        run: |
          python -m py_compile \
            collector.py \
            v591_paper_engine.py \
            v592_paper_runner.py \
            v594_health.py \
            radar_healthcheck.py \
            radar_missed_opportunities.py \
            radar_quote_monitor.py \
            radar_execution_safety.py \
            radar_pretrade_safety.py \
            radar_pretrade_history.py \
            radar_token_security.py \
            v611_b2_shadow.py \
            radar_execution_accuracy.py

      - name: Collect GTA6 market data
        run: python collector.py

      - name: Pre-Trade Safety V2 (shadow, read-only)
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          mkdir -p data/v594
          python radar_pretrade_safety.py > data/v594/pretrade_safety.json
          python -m json.tool data/v594/pretrade_safety.json

      - name: Log shadow pretrade history
        run: python radar_pretrade_history.py

      - name: B2 independent shadow papertrading
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: |
          python v611_b2_shadow.py
          python -m json.tool data/v611/b2_report.json

      - name: Run paper engine A B C
        run: python v592_paper_runner.py

      - name: Record scan history
        run: python v594_health.py

      - name: Radar Healthcheck V1
        run: |
          mkdir -p data/v594
          python radar_healthcheck.py > data/v594/radar_healthcheck.json
          python -m json.tool data/v594/radar_healthcheck.json

      - name: Missed Opportunities Audit V1 (read-only)
        run: |
          python radar_missed_opportunities.py > data/v594/missed_opportunities.json
          python -m json.tool data/v594/missed_opportunities.json

      - name: Jupiter Quote Monitor V1 (read-only)
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          python radar_quote_monitor.py > data/v594/jupiter_quote_monitor.json
          python -m json.tool data/v594/jupiter_quote_monitor.json

      - name: Token Security V1 (read-only, live blocked)
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          python radar_token_security.py > data/v594/token_security.json
          python -m json.tool data/v594/token_security.json

      - name: Execution Safety V1 (read-only, live blocked)
        run: |
          python radar_execution_safety.py > data/v594/execution_safety.json
          python -m json.tool data/v594/execution_safety.json

      - name: Execution Accuracy Monitor V1 (B and B2, read-only)
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          python radar_execution_accuracy.py
          python -m json.tool data/v612/execution_accuracy.json

      - name: Save collector portfolio and history
        env:
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add \
              data/learning.db \
              data/latest_scan.json \
              data/v591/portfolio.json \
              data/v591/preview.json \
              data/v594/scan_history.json \
              data/v594/radar_healthcheck.json \
              data/v594/missed_opportunities.json \
              data/v594/jupiter_quote_monitor.json \
              data/v594/execution_safety.json \
              data/v594/pretrade_safety.json \
              data/v594/pretrade_history.json \
              data/v594/token_security.json \
              data/v611/b2_portfolio.json \
              data/v611/b2_report.json \
              data/v612/execution_accuracy.json \
              data/v612/execution_accuracy_history.json

            if git diff --cached --quiet; then
              echo 'No changes'
              exit 0
            fi

            git commit -m 'data: GTA6 automatic collector [skip ci]'

            if git push origin HEAD:main; then
              echo 'Collector, portfolio, B2, audit and safety saved'
              exit 0
            fi

            echo 'Remote changed - rescan safely'
            git fetch origin main
            git reset --hard origin/main

            python collector.py
            python radar_pretrade_safety.py > data/v594/pretrade_safety.json
            python radar_pretrade_history.py
            python v611_b2_shadow.py
            python v592_paper_runner.py
            python v594_health.py
            mkdir -p data/v594
            python radar_healthcheck.py > data/v594/radar_healthcheck.json
            python radar_missed_opportunities.py > data/v594/missed_opportunities.json
            python radar_quote_monitor.py > data/v594/jupiter_quote_monitor.json
            python radar_token_security.py > data/v594/token_security.json
            python radar_execution_safety.py > data/v594/execution_safety.json
            python radar_execution_accuracy.py
            sleep 2
          done

          echo 'Could not publish data' >&2
          exit 1

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-scans-${{ github.run_id }}
          path: |
            data/latest_scan.json
            data/v591/preview.json
            data/v594/scan_history.json
            data/v594/radar_healthcheck.json
            data/v594/missed_opportunities.json
            data/v594/jupiter_quote_monitor.json
            data/v594/execution_safety.json
            data/v594/pretrade_safety.json
            data/v594/pretrade_history.json
            data/v594/token_security.json
            data/v611/b2_portfolio.json
            data/v611/b2_report.json
            data/v612/execution_accuracy.json
            data/v612/execution_accuracy_history.json
          if-no-files-found: ignore
          retention-days: 14
