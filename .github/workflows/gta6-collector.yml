
name: GTA6 Learning Collector

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gta6-learning-db
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements-collector.txt

      - name: Synchronize latest data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Collect GTA6 data
        run: python collector.py

      - name: Save collected data safely
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add data/learning.db data/latest_scan.json

            if git diff --cached --quiet; then
              echo "No data changes"
              exit 0
            fi

            git commit -m "data: GTA6 observations [skip ci]"

            if git push origin HEAD:main; then
              echo "Collector data saved"
              exit 0
            fi

            echo "Remote branch changed. Refreshing database."

            git fetch origin main
            git reset --hard origin/main

            # Re-run against the newest database.
            python collector.py

            sleep 2
          done

          echo "Could not publish data after 3 attempts" >&2
          exit 1

      - name: Upload collector status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta6-learning-run-${{ github.run_id }}
          path: data/latest_scan.json
          if-no-files-found: ignore
          retention-days: 7
