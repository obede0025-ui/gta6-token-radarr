name: Research-only liquidity spike classifications
on:
  push:
    branches: [feature/liquidity-spike-evidence-20261120]
    paths:
      - 'research_liquidity_spike_classifier.py'
      - 'tests/test_research_liquidity_spike_classifier.py'
      - '.github/workflows/research-liquidity-spike-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test read-only classifier
        run: |
          python -m py_compile research_liquidity_spike_classifier.py
          python -m unittest tests.test_research_liquidity_spike_classifier -v
